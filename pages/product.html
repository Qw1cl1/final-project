<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детали товара — ElectroMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Premium Header (Same as Index) -->
  <header class="header-main glass shadow-sm">
    <div class="container h-100 d-flex align-items-center justify-content-between gap-4">
      <a href="../index.html" class="d-flex align-items-center text-primary text-decoration-none" style="font-family: 'Outfit', sans-serif;">
        <i class="bi bi-lightning-charge-fill fs-2 me-2"></i>
        <span class="fs-3 fw-800 tracking-tighter">ELECTRO</span>
      </a>
      <div class="search-container d-none d-md-block">
        <i class="bi bi-search search-icon"></i>
        <input type="text" class="search-input-premium" placeholder="Поиск товаров...">
      </div>
      <div class="d-flex align-items-center gap-2 gap-md-4">
        <button id="theme-toggle" class="btn btn-light rounded-circle p-2" style="width: 42px; height: 42px;">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="favorites.html" class="nav-link-custom d-flex flex-column align-items-center position-relative">
          <i class="bi bi-heart fs-5"></i>
          <span id="fav-badge" class="badge bg-danger position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
        <a href="cart.html" class="nav-link-custom d-flex flex-column align-items-center position-relative">
          <i class="bi bi-bag fs-5"></i>
          <span id="cart-badge" class="badge bg-primary position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-5" id="product-container">
    <!-- Skeleton Loading -->
    <div class="row g-5">
      <div class="col-lg-7"><div class="card-premium skeleton" style="height: 500px;"></div></div>
      <div class="col-lg-5">
        <div class="card-premium skeleton mb-4" style="height: 200px;"></div>
        <div class="card-premium skeleton" style="height: 300px;"></div>
      </div>
    </div>
  </main>

  <footer class="bg-card py-10 border-top mt-10">
    <div class="container text-center text-muted small">
      &copy; 2024 ElectroMarket. Все права защищены.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await App.init();
      const container = document.getElementById('product-container');
      const productId = new URLSearchParams(window.location.search).get('id');

      const product = Store.products.find(p => p.id === productId);
      if (!product) {
        container.innerHTML = `<div class="text-center py-10"><div class="bg-primary-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-5" style="width:100px;height:100px;"><i class="bi bi-box-seam fs-1"></i></div><h2 class="fw-800 mb-3">Товар не найден</h2><p class="text-muted mb-5">Возможно, он был удален или перемещен.</p><a href="../index.html" class="btn btn-primary px-6 py-3">На главную</a></div>`;
        return;
      }

      // Bug #10 fix: update page title dynamically
      document.title = `${product.name} — ElectroMarket`;

      // Track Recently Viewed
      let recent = JSON.parse(localStorage.getItem('recentlyViewed') || '[]');
      recent = [productId, ...recent.filter(id => id !== productId)].slice(0, 10);
      localStorage.setItem('recentlyViewed', JSON.stringify(recent));

      const isFav = Store.favorites.includes(product.id);

      container.innerHTML = `
        <nav aria-label="breadcrumb" class="mb-5 animate-fade-in-up">
          <ol class="breadcrumb m-0">
            <li class="breadcrumb-item"><a href="../index.html" class="text-muted text-decoration-none">Главная</a></li>
            <li class="breadcrumb-item"><a href="catalog.html?cat=${encodeURIComponent(product.category)}" class="text-muted text-decoration-none">${product.category}</a></li>
            <li class="breadcrumb-item active fw-bold">${product.name}</li>
          </ol>
        </nav>

        <div class="row g-5">
          <div class="col-lg-7 animate-fade-in-up">
            <div class="card-premium glass p-5 text-center position-relative d-flex align-items-center justify-content-center" style="min-height: 500px;">
              <button class="fav-btn-float ${isFav ? 'active' : ''}" data-id="${product.id}" style="top: 2rem; right: 2rem;" aria-label="В избранное">
                <i class="bi ${isFav ? 'bi-heart-fill' : 'bi-heart'}"></i>
              </button>
              <img src="${product.image}" class="img-fluid" style="max-height: 400px; object-fit: contain;" alt="${product.name}">
            </div>
          </div>

          <div class="col-lg-5 animate-fade-in-up" style="animation-delay: 0.1s;">
            <div class="card-premium p-5 mb-4 shadow-lg">
              <div class="mb-4 d-flex align-items-center gap-3 flex-wrap">
                <span class="badge bg-primary-light text-primary px-3 py-2 fw-bold">${product.category}</span>
                <span class="text-warning"><i class="bi bi-star-fill"></i> ${product.rating}</span>
                <span class="text-muted small">(${product.reviews} отзывов)</span>
                ${product.isNew ? '<span class="badge bg-success">NEW</span>' : ''}
              </div>

              <h1 class="display-5 fw-800 mb-4" style="font-family: 'Outfit', sans-serif;">${product.name}</h1>

              <div class="mb-5">
                ${product.oldPrice ? `<div class="text-muted text-decoration-line-through fs-5">${App.formatPrice(product.oldPrice)}</div>` : ''}
                <div class="display-4 fw-800 text-primary">${App.formatPrice(product.price)}</div>
                ${product.oldPrice ? `<div class="badge bg-danger mt-2">Скидка ${Math.round((1 - product.price/product.oldPrice)*100)}%</div>` : ''}
              </div>

              <div class="d-grid gap-3">
                <button class="btn btn-primary btn-lg py-3 fs-5 btn-add-cart" data-id="${product.id}">
                  <i class="bi bi-bag-plus-fill me-2"></i> Добавить в корзину
                </button>
                <a href="cart.html" class="btn btn-light btn-lg py-3 fs-5">
                  Купить в 1 клик
                </a>
              </div>

              <div class="mt-5 p-4 rounded-xl border d-flex flex-column gap-3 small" style="background: var(--bg-body);">
                <div class="d-flex align-items-center gap-3"><i class="bi bi-truck text-primary fs-4"></i> <span>Доставка: <b>Завтра</b> (Бесплатно)</span></div>
                <div class="d-flex align-items-center gap-3"><i class="bi bi-shield-check text-success fs-4"></i> <span>Гарантия: <b>24 месяца</b></span></div>
                <div class="d-flex align-items-center gap-3"><i class="bi bi-arrow-counterclockwise text-warning fs-4"></i> <span>Возврат: <b>14 дней</b></span></div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-10 animate-fade-in-up" style="animation-delay: 0.2s;">
          <h2 class="h1 fw-800 mb-5">О товаре</h2>
          <div class="row g-5">
            <div class="col-lg-8">
              <div class="card-premium p-5 glass mb-5">
                <h4 class="fw-bold mb-4">Описание</h4>
                <p class="text-muted lh-lg fs-5">${product.description || 'Премиальный продукт от ведущего производителя. Сочетает в себе инновационные технологии и безупречное качество сборки.'}</p>
              </div>

              <div id="reviews-section">
                <div class="d-flex align-items-center justify-content-between mb-5">
                  <h4 class="fw-bold m-0">Отзывы покупателей</h4>
                  <button class="btn btn-light" onclick="document.getElementById('review-form-card').scrollIntoView({behavior: 'smooth'})">Написать отзыв</button>
                </div>
                <div id="reviews-list" class="d-flex flex-column gap-4">
                  <!-- Reviews via JS -->
                </div>
              </div>
            </div>

            <div class="col-lg-4">
              <div class="card-premium p-5 glass position-sticky" style="top: 120px;" id="review-form-card">
                <h4 class="fw-bold mb-4">Ваше мнение</h4>
                <form id="review-form">
                  <div class="mb-4">
                    <label class="form-label small fw-bold">Оценка</label>
                    <div class="d-flex gap-2 text-warning fs-4" id="star-rating">
                      <i class="bi bi-star cursor-pointer" data-v="1"></i>
                      <i class="bi bi-star cursor-pointer" data-v="2"></i>
                      <i class="bi bi-star cursor-pointer" data-v="3"></i>
                      <i class="bi bi-star cursor-pointer" data-v="4"></i>
                      <i class="bi bi-star cursor-pointer" data-v="5"></i>
                    </div>
                    <input type="hidden" id="selected-rating" value="0">
                  </div>
                  <div class="mb-4">
                    <input type="text" class="form-control border-0 p-3 rounded-lg" id="rev-name" placeholder="Ваше имя" required style="background: var(--bg-body);">
                  </div>
                  <div class="mb-4">
                    <textarea class="form-control border-0 p-3 rounded-lg" id="rev-text" rows="4" placeholder="Поделитесь впечатлениями..." required style="background: var(--bg-body);"></textarea>
                  </div>
                  <button class="btn btn-primary w-100 py-3" type="submit">Опубликовать</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      `;

      // Bug #11 fix: diverse dates for reviews
      const renderReviews = () => {
        const list = document.getElementById('reviews-list');
        const reviews = [
          { name: "Алексей", text: "Шикарный аппарат! Работает идеально, очень доволен покупкой.", date: "18.04.2024", stars: 5 },
          { name: "Мария", text: "Пользуюсь неделю — всё устраивает. Доставили быстро.", date: "02.05.2024", stars: 5 },
          { name: "Дмитрий", text: "Лучшее вложение денег в этом году. Рекомендую всем!", date: "09.05.2024", stars: 4 },
          { name: "Елена", text: "Упаковка целая, товар соответствует описанию. Отличный продавец.", date: "14.05.2024", stars: 5 }
        ];

        list.innerHTML = reviews.map(r => `
          <div class="card-premium p-4 glass">
            <div class="d-flex justify-content-between mb-3 align-items-start">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold flex-shrink-0" style="width: 40px; height: 40px;">${r.name[0]}</div>
                <div>
                  <div class="fw-bold text-main">${r.name}</div>
                  <div class="text-warning small">${'<i class="bi bi-star-fill"></i>'.repeat(r.stars)}${'<i class="bi bi-star"></i>'.repeat(5 - r.stars)}</div>
                </div>
              </div>
              <span class="text-muted small flex-shrink-0">${r.date}</span>
            </div>
            <p class="text-muted m-0">${r.text}</p>
          </div>
        `).join('');
      };

      renderReviews();

      // Bug #11 fix: proper numeric comparison for star rating
      let selectedRating = 0;
      document.querySelectorAll('#star-rating i').forEach(star => {
        star.style.cursor = 'pointer';
        star.addEventListener('mouseenter', (e) => {
          const v = parseInt(e.target.dataset.v);
          document.querySelectorAll('#star-rating i').forEach(s => {
            const sv = parseInt(s.dataset.v);
            s.className = sv <= v ? 'bi bi-star-fill' : 'bi bi-star';
          });
        });
        star.addEventListener('mouseleave', () => {
          document.querySelectorAll('#star-rating i').forEach(s => {
            const sv = parseInt(s.dataset.v);
            s.className = sv <= selectedRating ? 'bi bi-star-fill' : 'bi bi-star';
          });
        });
        star.addEventListener('click', (e) => {
          selectedRating = parseInt(e.target.dataset.v);
          document.getElementById('selected-rating').value = selectedRating;
        });
      });

      // Bug #3 fix: review form submit handler
      document.getElementById('review-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('rev-name').value.trim();
        const text = document.getElementById('rev-text').value.trim();
        const rating = parseInt(document.getElementById('selected-rating').value) || 5;

        if (!name || !text) {
          App.showNotification('Заполните имя и текст отзыва', 'danger');
          return;
        }

        const list = document.getElementById('reviews-list');
        const today = new Date().toLocaleDateString('ru-RU');
        const newReview = `
          <div class="card-premium p-4 glass animate-fade-in-up">
            <div class="d-flex justify-content-between mb-3 align-items-start">
              <div class="d-flex align-items-center gap-3">
                <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center fw-bold flex-shrink-0" style="width: 40px; height: 40px;">${name[0].toUpperCase()}</div>
                <div>
                  <div class="fw-bold text-main">${name}</div>
                  <div class="text-warning small">${'<i class="bi bi-star-fill"></i>'.repeat(rating)}${'<i class="bi bi-star"></i>'.repeat(5 - rating)}</div>
                </div>
              </div>
              <span class="text-muted small">${today}</span>
            </div>
            <p class="text-muted m-0">${text}</p>
          </div>
        `;
        list.insertAdjacentHTML('afterbegin', newReview);

        e.target.reset();
        selectedRating = 0;
        document.querySelectorAll('#star-rating i').forEach(s => s.className = 'bi bi-star');
        document.getElementById('selected-rating').value = 0;
        App.showNotification('Спасибо! Ваш отзыв опубликован.', 'success');
        document.getElementById('reviews-section').scrollIntoView({ behavior: 'smooth' });
      });
    });
  </script>
</body>
</html>

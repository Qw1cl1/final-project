<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — ElectroMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Premium Header -->
  <header class="header-main glass shadow-sm">
    <div class="container h-100 d-flex align-items-center justify-content-between gap-4">
      <a href="../index.html" class="d-flex align-items-center text-primary text-decoration-none" style="font-family: 'Outfit', sans-serif;">
        <i class="bi bi-lightning-charge-fill fs-2 me-2"></i>
        <span class="fs-3 fw-800 tracking-tighter">ELECTRO</span>
      </a>
      <div class="search-container d-none d-md-block">
        <i class="bi bi-search search-icon"></i>
        <input type="text" class="search-input-premium" placeholder="Поиск товаров...">
      </div>
      <div class="d-flex align-items-center gap-2 gap-md-4">
        <button id="theme-toggle" class="btn btn-light rounded-circle p-2" style="width: 42px; height: 42px;">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="favorites.html" class="nav-link-custom d-flex flex-column align-items-center position-relative">
          <i class="bi bi-heart fs-5"></i>
          <span id="fav-badge" class="badge bg-danger position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
        <a href="cart.html" class="nav-link-custom d-flex flex-column align-items-center position-relative">
          <i class="bi bi-bag fs-5"></i>
          <span id="cart-badge" class="badge bg-primary position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-10 flex-grow-1">
    <!-- Breadcrumbs -->
    <nav aria-label="breadcrumb" class="mb-6">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="../index.html" class="text-decoration-none text-muted">Главная</a></li>
        <li class="breadcrumb-item active text-primary fw-bold" aria-current="page" id="catalog-breadcrumb">Все товары</li>
      </ol>
    </nav>

    <div class="row g-5">
      <!-- Sidebar / Filters -->
      <aside class="col-lg-3">
        <div class="card-premium glass p-6 position-sticky" style="top: 120px;">
          <div class="d-flex align-items-center justify-content-between mb-6">
            <h5 class="fw-800 m-0" style="font-family: 'Outfit', sans-serif;">Фильтры</h5>
            <button type="reset" form="filter-form" class="btn btn-link p-0 text-muted small text-decoration-none hover-primary">Сбросить</button>
          </div>

          <form id="filter-form">
            <div class="mb-6">
              <label class="form-label fw-bold small text-uppercase tracking-wider text-muted mb-3">Цена (₽)</label>
              <div class="d-flex align-items-center gap-3">
                <input type="number" class="form-control glass border-0" id="price-min" placeholder="От">
                <span class="text-muted">—</span>
                <input type="number" class="form-control glass border-0" id="price-max" placeholder="До">
              </div>
            </div>
            
            <div class="mb-6">
              <label class="form-label fw-bold small text-uppercase tracking-wider text-muted mb-3">Предложения</label>
              <div class="d-flex flex-column gap-3">
                <div class="form-check custom-check">
                  <input class="form-check-input" type="checkbox" id="filter-discount">
                  <label class="form-check-label" for="filter-discount">Со скидкой</label>
                </div>
                <div class="form-check custom-check">
                  <input class="form-check-input" type="checkbox" id="filter-new">
                  <label class="form-check-label" for="filter-new">Новинки</label>
                </div>
                <div class="form-check custom-check">
                  <input class="form-check-input" type="checkbox" id="filter-popular">
                  <label class="form-check-label" for="filter-popular">Хиты продаж</label>
                </div>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold">Применить</button>
          </form>
        </div>
      </aside>

      <!-- Main Catalog -->
      <div class="col-lg-9">
        <div class="d-flex align-items-end justify-content-between mb-8">
          <div>
            <h1 class="h1 fw-800 mb-2" style="font-family: 'Outfit', sans-serif;" id="catalog-title">Все товары</h1>
            <p class="text-muted m-0" id="total-products">Загрузка товаров...</p>
          </div>
          
          <div class="d-flex align-items-center gap-3">
            <label class="text-muted small fw-bold text-uppercase d-none d-md-block">Сортировка:</label>
            <select class="form-select glass border-0 w-auto fw-bold" id="sort-select">
              <option value="popular">По популярности</option>
              <option value="price-asc">Дешевле</option>
              <option value="price-desc">Дороже</option>
              <option value="rating">По рейтингу</option>
            </select>
          </div>
        </div>

        <!-- Grid -->
        <div class="row g-4" id="catalog-grid">
          <!-- Skeletons -->
          <div class="col-lg-4 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
          <div class="col-lg-4 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
          <div class="col-lg-4 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
          <div class="col-lg-4 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
          <div class="col-lg-4 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
          <div class="col-lg-4 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-card py-10 border-top mt-10">
    <div class="container text-center text-muted small">
      &copy; 2024 ElectroMarket. Все права защищены.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalog.js"></script>
</body>
</html>

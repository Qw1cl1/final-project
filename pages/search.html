<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск — ElectroMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Premium Header -->
  <header class="header-main glass shadow-sm">
    <div class="container h-100 d-flex align-items-center justify-content-between gap-4">
      <a href="../index.html" class="d-flex align-items-center text-primary text-decoration-none" style="font-family: 'Outfit', sans-serif;">
        <i class="bi bi-lightning-charge-fill fs-2 me-2"></i>
        <span class="fs-3 fw-800 tracking-tighter">ELECTRO</span>
      </a>
      <div class="search-container d-none d-md-block">
        <i class="bi bi-search search-icon"></i>
        <input type="text" class="search-input-premium" id="header-search" placeholder="Поиск товаров...">
      </div>
      <div class="d-flex align-items-center gap-2 gap-md-4">
        <button id="theme-toggle" class="btn btn-light rounded-circle p-2" style="width: 42px; height: 42px;">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="favorites.html" class="nav-link-custom d-flex flex-column align-items-center position-relative">
          <i class="bi bi-heart fs-5"></i>
          <span id="fav-badge" class="badge bg-danger position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
        <a href="cart.html" class="nav-link-custom d-flex flex-column align-items-center position-relative">
          <i class="bi bi-bag fs-5"></i>
          <span id="cart-badge" class="badge bg-primary position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-10 flex-grow-1">
    <div class="mb-10 text-center">
      <h1 class="h1 fw-800 mb-2" style="font-family: 'Outfit', sans-serif;" id="search-title">Результаты поиска</h1>
      <p class="text-muted" id="search-count">Загрузка результатов...</p>
    </div>

    <div id="search-grid" class="row g-4">
      <!-- Skeletons -->
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
    </div>
  </main>

  <footer class="bg-card py-10 border-top mt-10">
    <div class="container text-center text-muted small">
      &copy; 2024 ElectroMarket. Все права защищены.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await App.init();
      
      const query = new URLSearchParams(window.location.search).get('q');
      const titleEl = document.getElementById('search-title');
      const countEl = document.getElementById('search-count');
      const grid = document.getElementById('search-grid');
      
      if (!query) {
        titleEl.textContent = 'Введите запрос для поиска';
        countEl.textContent = '';
        grid.innerHTML = '';
        return;
      }
      
      titleEl.textContent = `Результаты по запросу «${query}»`;
      
      const qLower = query.toLowerCase();
      const results = Store.products.filter(p => 
        p.name.toLowerCase().includes(qLower) || 
        p.category.toLowerCase().includes(qLower) ||
        (p.brand && p.brand.toLowerCase().includes(qLower))
      );

      countEl.textContent = results.length === 0 ? 'Ничего не найдено' : `Найдено ${results.length} товаров`;

      if (results.length === 0) {
        grid.innerHTML = `
          <div class="col-12 text-center py-10 animate-fade-in-up">
            <div class="bg-primary-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px;">
              <i class="bi bi-search fs-2"></i>
            </div>
            <h3 class="fw-800 mb-2">Мы ничего не нашли</h3>
            <p class="text-muted mb-6">Попробуйте поискать что-нибудь другое или загляните в каталог.</p>
            <a href="catalog.html" class="btn btn-primary px-8 py-3 fw-bold">Перейти в каталог</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = results.map((p, index) => {
        const cardHtml = App.generateProductCard(p);
        return cardHtml.replace('class="col-12 col-sm-6 col-lg-3 mb-4"', `class="col-12 col-sm-6 col-lg-3 mb-4 stagger-item" style="animation-delay: ${index * 0.04}s"`);
      }).join('');
    });
  </script>
</body>
</html>

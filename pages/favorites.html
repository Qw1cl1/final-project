<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Избранное — ElectroMarket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Premium Header -->
  <header class="header-main glass shadow-sm">
    <div class="container h-100 d-flex align-items-center justify-content-between gap-4">
      <a href="../index.html" class="d-flex align-items-center text-primary text-decoration-none" style="font-family: 'Outfit', sans-serif;">
        <i class="bi bi-lightning-charge-fill fs-2 me-2"></i>
        <span class="fs-3 fw-800 tracking-tighter">ELECTRO</span>
      </a>
      <div class="search-container d-none d-md-block">
        <i class="bi bi-search search-icon"></i>
        <input type="text" class="search-input-premium" placeholder="Поиск товаров...">
      </div>
      <div class="d-flex align-items-center gap-2 gap-md-4">
        <button id="theme-toggle" class="btn btn-light rounded-circle p-2" style="width: 42px; height: 42px;">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        <a href="favorites.html" class="nav-link-custom d-flex flex-column align-items-center position-relative active">
          <i class="bi bi-heart-fill fs-5"></i>
          <span id="fav-badge" class="badge bg-danger position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
        <a href="cart.html" class="nav-link-custom d-flex flex-column align-items-center position-relative">
          <i class="bi bi-bag fs-5"></i>
          <span id="cart-badge" class="badge bg-primary position-absolute top-0 start-100 translate-middle-x rounded-pill" style="display:none; font-size: 0.65rem;">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-10 flex-grow-1">
    <div class="d-flex align-items-center justify-content-between mb-8">
      <h1 class="h1 fw-800 m-0" style="font-family: 'Outfit', sans-serif;">Избранное</h1>
      <span class="text-muted" id="fav-summary">0 товаров</span>
    </div>

    <div id="favorites-grid" class="row g-4">
      <!-- Skeletons -->
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
      <div class="col-lg-3 col-md-6"><div class="card-premium skeleton" style="height: 400px;"></div></div>
    </div>

    <!-- Empty State -->
    <div id="empty-fav" class="card-premium glass p-10 text-center animate-fade-in-up" style="display: none;">
      <div class="bg-primary-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-5" style="width: 100px; height: 100px;">
        <i class="bi bi-heart fs-1"></i>
      </div>
      <h2 class="fw-800 mb-3">Список желаний пуст</h2>
      <p class="text-muted mb-5 max-w-sm mx-auto">Сохраняйте товары, которые вам понравились, чтобы вернуться к ним позже.</p>
      <a href="../index.html" class="btn btn-primary btn-lg px-8">На главную</a>
    </div>
  </main>

  <footer class="bg-card py-10 border-top mt-10">
    <div class="container text-center text-muted small">
      &copy; 2024 ElectroMarket. Все права защищены.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await App.init();
      const grid = document.getElementById('favorites-grid');
      const emptyState = document.getElementById('empty-fav');
      const summary = document.getElementById('fav-summary');
      
      const render = () => {
        if (Store.favorites.length === 0) {
          grid.style.display = 'none';
          emptyState.style.display = 'block';
          summary.textContent = '0 товаров';
          return;
        }

        grid.style.display = '';
        grid.className = 'row g-4';
        
        const favProducts = Store.products.filter(p => Store.favorites.includes(p.id));
        grid.innerHTML = favProducts.map(p => App.generateProductCard(p)).join('');
        summary.textContent = `${favProducts.length} товаров`;
      };

      render();

      // Listen for changes
      document.addEventListener('favoritesUpdated', render);
    });
  </script>
</body>
</html>
